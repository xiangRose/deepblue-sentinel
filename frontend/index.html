<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深蓝哨兵 - 钓鱼威胁感知平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #0a1a30;
            color: #e0f0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 头部样式 */
        header {
            padding: 20px 40px;
            border-bottom: 1px solid #1a3a5f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ccff, #0066ff);
        }

        .logo-text h1 {
            font-size: 24px;
            color: #e0f0ff;
            letter-spacing: 1px;
        }

        .logo-text p {
            font-size: 12px;
            color: #80bfff;
            margin-top: 2px;
        }

        .logout-btn {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid #00ccff;
            color: #00ccff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #00ccff;
            color: #0a1a30;
        }

        .hidden {
            display: none !important;
        }

        /* 主内容区 */
        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* 登录注册容器 */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 60vh;
        }

        .auth-box {
            background: rgba(15, 35, 60, 0.8);
            border: 1px solid #1a3a5f;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.1);
        }

        .auth-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ccff;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #80bfff;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 26, 48, 0.8);
            border: 1px solid #1a3a5f;
            border-radius: 4px;
            color: #e0f0ff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #00ccff;
            box-shadow: 0 0 8px rgba(0, 204, 255, 0.2);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0066ff, #00ccff);
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .auth-btn:hover {
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.3);
        }

        .auth-switch {
            text-align: center;
            color: #80bfff;
            font-size: 14px;
        }

        .auth-switch span {
            color: #00ccff;
            cursor: pointer;
            text-decoration: underline;
        }

        /* 主界面容器 */
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 35, 60, 0.6);
            border-radius: 6px;
            border: 1px solid #1a3a5f;
        }

        .user-info p {
            color: #80bfff;
        }

        .user-info span {
            color: #00ccff;
            font-weight: bold;
        }

        /* 检测模块 */
        .detect-section {
            background: rgba(15, 35, 60, 0.8);
            border: 1px solid #1a3a5f;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.1);
        }

        .detect-section h2 {
            color: #00ccff;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .detect-input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .detect-input-group input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(10, 26, 48, 0.8);
            border: 1px solid #1a3a5f;
            border-radius: 4px;
            color: #e0f0ff;
            font-size: 15px;
            outline: none;
        }

        .detect-input-group input:focus {
            border-color: #00ccff;
        }

        .detect-btn {
            padding: 0 30px;
            background: linear-gradient(90deg, #0066ff, #00ccff);
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .detect-btn:hover {
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.3);
        }

        /* 检测结果 */
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid;
        }

        .result-high {
            background: rgba(255, 50, 50, 0.1);
            border-color: #ff3333;
        }

        .result-medium {
            background: rgba(255, 150, 0, 0.1);
            border-color: #ff9900;
        }

        .result-low {
            background: rgba(0, 204, 100, 0.1);
            border-color: #00cc66;
        }

        .result-box h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .result-box p {
            color: #b0d0ff;
            margin-bottom: 15px;
        }

        .result-similar h4 {
            font-size: 14px;
            color: #80bfff;
            margin-bottom: 8px;
        }

        .result-similar ul {
            list-style: none;
            padding-left: 10px;
        }

        .result-similar li {
            color: #b0d0ff;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .text-high {
            color: #ff3333;
        }

        .text-medium {
            color: #ff9900;
        }

        .text-low {
            color: #00cc66;
        }

        /* 历史记录模块 */
        .history-section {
            background: rgba(15, 35, 60, 0.8);
            border: 1px solid #1a3a5f;
            border-radius: 8px;
            padding: 30px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-header h2 {
            color: #00ccff;
            font-size: 20px;
        }

        .history-header input {
            width: 300px;
            padding: 10px 15px;
            background: rgba(10, 26, 48, 0.8);
            border: 1px solid #1a3a5f;
            border-radius: 4px;
            color: #e0f0ff;
            outline: none;
        }

        .history-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .history-list li {
            padding: 15px;
            border-bottom: 1px solid #1a3a5f;
            margin-bottom: 10px;
        }

        .history-url {
            font-weight: bold;
            color: #e0f0ff;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .history-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .history-time {
            color: #80bfff;
            font-size: 12px;
        }

        .history-msg {
            color: #b0d0ff;
            font-size: 13px;
        }

        /* 底部样式 */
        footer {
            padding: 20px 40px;
            border-top: 1px solid #1a3a5f;
            text-align: center;
            color: #80bfff;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header>
        <div class="logo">
            <div class="logo-circle"></div>
            <div class="logo-text">
                <h1>DEEPBLUE<span>SENTINEL</span></h1>
                <p>钓鱼威胁感知平台</p>
            </div>
        </div>
        <button id="logout-btn" class="logout-btn hidden">退出登录</button>
    </header>

    <!-- 主内容区 -->
    <main>
        <!-- 登录注册容器 -->
        <div id="auth-container" class="auth-container">
            <!-- 登录框 -->
            <div id="login-box" class="auth-box">
                <h2>账号登录</h2>
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="login-username" placeholder="请输入用户名">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码">
                </div>
                <button id="login-btn" class="auth-btn">登录</button>
                <div class="auth-switch">
                    还没有账号？<span id="show-register">立即注册</span>
                </div>
            </div>

            <!-- 注册框 -->
            <div id="register-box" class="auth-box hidden">
                <h2>账号注册</h2>
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="register-username" placeholder="请输入用户名">
                </div>
                <div class="input-group">
                    <label>邮箱</label>
                    <input type="email" id="register-email" placeholder="请输入邮箱">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="register-password" placeholder="请输入密码">
                </div>
                <button id="register-btn" class="auth-btn">注册</button>
                <div class="auth-switch">
                    已有账号？<span id="show-login">立即登录</span>
                </div>
            </div>
        </div>

        <!-- 登录后的主界面 -->
        <div id="main-container" class="main-container hidden">
            <div class="user-info">
                <p>欢迎回来，<span id="username-display">用户</span></p>
            </div>

            <!-- 检测模块 -->
            <div class="detect-section">
                <h2>钓鱼域名检测</h2>
                <div class="detect-input-group">
                    <input type="text" id="url-input" placeholder="请输入要检测的URL，例如：https://www.baidu.com">
                    <button id="detect-btn" class="detect-btn">开始检测</button>
                </div>

                <!-- 检测结果 -->
                <div id="result-box" class="result-box hidden">
                    <h3 id="result-verdict"></h3>
                    <p id="result-message"></p>
                    <div class="result-similar">
                        <h4>匹配相似恶意样本</h4>
                        <ul id="result-similar"></ul>
                    </div>
                </div>
            </div>

            <!-- 历史记录模块 -->
            <div class="history-section">
                <div class="history-header">
                    <h2>检测历史记录</h2>
                    <input type="text" id="search-input" placeholder="输入URL关键词搜索">
                </div>
                <ul id="history-list" class="history-list">
                    <li>暂无检测记录</li>
                </ul>
            </div>
        </div>
    </main>

    <!-- 底部 -->
    <footer>
        © 深蓝哨兵 · 实时反钓鱼引擎 BRANDCOLOR | 水域形成球体 | 小红书号 changn
    </footer>

    <!-- 内嵌JS，彻底解决加载失败问题 -->
    <script>
        // 后端接口地址
        const API_BASE = "http://127.0.0.1:5000/api";

        // 页面DOM完全加载完成后再执行所有代码
        window.onload = async () => {
            // 绑定所有按钮事件
            bindEvents();
            // 检查登录状态
            await checkLoginStatus();
        };

        // 绑定所有按钮事件
        function bindEvents() {
            // 登录/注册切换
            document.getElementById("show-register").addEventListener("click", () => {
                document.getElementById("login-box").classList.add("hidden");
                document.getElementById("register-box").classList.remove("hidden");
            });
            document.getElementById("show-login").addEventListener("click", () => {
                document.getElementById("register-box").classList.add("hidden");
                document.getElementById("login-box").classList.remove("hidden");
            });

            // 登录、注册、退出、检测、搜索按钮
            document.getElementById("login-btn").addEventListener("click", login);
            document.getElementById("register-btn").addEventListener("click", register);
            document.getElementById("logout-btn").addEventListener("click", logout);
            document.getElementById("detect-btn").addEventListener("click", detectUrl);
            document.getElementById("search-input").addEventListener("input", loadHistory);
        }

        // 统一请求封装，修复401异常处理
        async function request(url, options = {}) {
            const defaultOptions = {
                headers: {
                    "Content-Type": "application/json",
                },
                credentials: "include",
            };

            try {
                const res = await fetch(`${API_BASE}${url}`, { ...defaultOptions, ...options });
                const data = await res.json();
                if (!res.ok) throw new Error(data.msg || "请求失败");
                return data;
            } catch (err) {
                // 401未登录属于正常情况，不弹窗报错
                if (err.message.includes("401") || err.message.includes("未登录")) {
                    throw new Error("unauthorized");
                }
                alert(err.message);
                throw err;
            }
        }

        // 检查登录状态，修复异常处理
        async function checkLoginStatus() {
            try {
                const user = await request("/user");
                // 登录成功，显示主界面
                document.getElementById("auth-container").classList.add("hidden");
                document.getElementById("main-container").classList.remove("hidden");
                document.getElementById("logout-btn").classList.remove("hidden");
                document.getElementById("username-display").textContent = user.username;
                await loadHistory();
            } catch (err) {
                // 未登录，显示登录框，不报错
                if (err.message === "unauthorized") {
                    document.getElementById("auth-container").classList.remove("hidden");
                    document.getElementById("main-container").classList.add("hidden");
                    document.getElementById("logout-btn").classList.add("hidden");
                }
            }
        }

        // 登录
        async function login() {
            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value.trim();
            if (!username || !password) return alert("请填写用户名和密码");

            await request("/login", {
                method: "POST",
                body: JSON.stringify({ username, password }),
            });
            alert("登录成功！");
            await checkLoginStatus();
        }

        // 注册
        async function register() {
            const username = document.getElementById("register-username").value.trim();
            const password = document.getElementById("register-password").value.trim();
            const email = document.getElementById("register-email").value.trim();
            if (!username || !password || !email) return alert("请填写所有字段");

            await request("/register", {
                method: "POST",
                body: JSON.stringify({ username, password, email }),
            });
            alert("注册成功！请登录");
            document.getElementById("show-login").click();
        }

        // 退出登录
        async function logout() {
            await request("/logout", { method: "POST" });
            alert("退出成功");
            await checkLoginStatus();
        }

        // 核心URL检测
        async function detectUrl() {
            const url = document.getElementById("url-input").value.trim();
            if (!url) return alert("请输入要检测的URL");

            const result = await request("/detect", {
                method: "POST",
                body: JSON.stringify({ url, advanced_mode: false }),
            });

            // 渲染检测结果
            const resultBox = document.getElementById("result-box");
            const verdictEl = document.getElementById("result-verdict");
            const messageEl = document.getElementById("result-message");
            const similarEl = document.getElementById("result-similar");

            // 清空之前的内容
            similarEl.innerHTML = "";

            // 设置结果样式和内容
            if (result.verdict === "钓鱼网站") {
                verdictEl.className = "result-high";
                verdictEl.textContent = "⛔ 钓鱼网站 | 高危风险";
            } else if (result.verdict === "可疑网站") {
                verdictEl.className = "result-medium";
                verdictEl.textContent = "⚠️ 可疑网站 | 中风险";
            } else {
                verdictEl.className = "result-low";
                verdictEl.textContent = "🛡️ 安全可信 | 低风险";
            }

            messageEl.textContent = result.message;

            // 渲染相似域名
            if (result.similar_domains && result.similar_domains.length > 0) {
                result.similar_domains.forEach((domain, index) => {
                    const li = document.createElement("li");
                    li.textContent = `${domain}（相似度：${result.similar_scores[index]}）`;
                    similarEl.appendChild(li);
                });
            }

            // 显示结果框
            resultBox.classList.remove("hidden");
            // 刷新历史记录
            await loadHistory();
        }

        // 加载历史记录
        async function loadHistory() {
            const keyword = document.getElementById("search-input").value.trim();
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";

            try {
                const url = keyword ? `/history?keyword=${encodeURIComponent(keyword)}` : "/history";
                const histories = await request(url);

                if (histories.length === 0) {
                    historyList.innerHTML = "<li>暂无检测记录</li>";
                    return;
                }

                histories.forEach(item => {
                    const li = document.createElement("li");
                    li.innerHTML = `
                        <div class="history-url">${item.url}</div>
                        <div class="history-info">
                            <span class="${item.verdict === '钓鱼网站' ? 'text-high' : item.verdict === '可疑网站' ? 'text-medium' : 'text-low'}">${item.verdict}</span>
                            <span class="history-time">${item.timestamp}</span>
                        </div>
                        <div class="history-msg">${item.message}</div>
                    `;
                    historyList.appendChild(li);
                });
            } catch (err) {
                historyList.innerHTML = "<li>加载历史记录失败</li>";
            }
        }
    </script>
</body>
</html>
