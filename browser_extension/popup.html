<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .header h3 {
      margin: 0;
      font-size: 16px;
      color: #00e0ff;
    }
    .status-card {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status-safe { background: rgba(46, 204, 113, 0.1); border: 1px solid #2ecc71; }
    .status-danger { background: rgba(255, 94, 126, 0.1); border: 1px solid #ff5e7e; }
    .status-title { font-weight: bold; margin-bottom: 6px; }
    .status-msg { font-size: 12px; color: #94a3b8; }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
    }
    .btn-primary { background: #00e0ff; color: #0f172a; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️</span>
    <h3>智捕钓域</h3>
  </div>
  
  <div id="statusContainer">
    <div class="status-card status-safe">
      <div class="status-title">🟢 当前页面安全</div>
      <div class="status-msg" id="currentUrl">正在检测...</div>
    </div>
  </div>

  <button class="btn btn-primary" id="openWebBtn">打开网页版</button>
  <button class="btn btn-secondary" id="recheckBtn">重新检测</button>

  <script src="popup.js"></script>
</body>
</html>
